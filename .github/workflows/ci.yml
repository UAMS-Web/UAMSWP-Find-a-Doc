# Public repository: Actions minutes are free, so this workflow is the remote
# gate. Private UAMS-Web repositories gate the same jobs behind RUN_REMOTE_CI
# and validate with the shared local CI runner instead.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: pint
        run: composer test:pint

  rector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: rector
        run: composer test:refactor

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: phpstan
        run: composer stan

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: phpunit
        run: composer test:unit

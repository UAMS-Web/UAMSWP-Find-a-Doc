name: CI

# Public repository: Actions minutes are free, so this workflow is the remote gate for pull
# requests to `master`.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the
# `checks` job, so this plugin does not carry a copy that drifts. The call runs the Composer,
# synced-files, emoji, aggregate-needs, Pint, Rector and PHPStan jobs, the unit suite as
# `composer test:unit`, and the PHP 8.2 floor lint. It runs on Linux only and leaves mutation
# testing off until its own ticket (`mutate: false`). `download-archive` is off in the call
# because this repository runs that check from its own `download-archive.yml`. `phpcs` stays off:
# this plugin has no PHPCS configuration. The chain's own header lists every input and default.
#
# `style-build` stays here, as this repository's own job: the golden CSS build has no
# counterpart in the chain.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the call
# and every plain job in this file, runs `if: always()`, and fails unless each reports
# `success`: a `skipped` or `cancelled` result fails it. Add a plain job here and to that
# `needs:` list in the same change; the `aggregate-needs` job in the chain fails the pull
# request when they disagree. Do not rename `CI`, and do not rename `checks` without changing
# `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, and the Composer
# scripts `test:pint`, `test:refactor`, `stan` and `test:unit`.

on:
  pull_request:
  push:
    branches: [master]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Pinned to a release tag, never a branch or a commit, so a change to the chain reaches this plugin
    # only when the pin moves.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.11.0
    with:
      linux-only: true
      mutate: false
      mutate-ignore: true
      global-test-symbols: false
      pest-command: composer test:unit
      floor-lint: true
      floor-lint-php: '8.2'
      # Parses every PHP file outside vendor, tests and node_modules with the floor PHP itself,
      # and fails when it finds none. `tests/` is left out: the suite runs on the development PHP.
      floor-lint-command: >-
        count=$(find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './node_modules/*' | wc -l);
        echo "Files to lint: $count";
        if [ "$count" -lt 1 ]; then echo "::error::No PHP files found to lint"; exit 1; fi;
        find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null
  style-build:
    name: Style build (golden CSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Sass entry imports the uams-2020 theme, so the build needs it. Pinned to the commit
      # the golden file was recorded against; a theme change that alters the CSS is a deliberate
      # bump of this ref together with the golden file.
      - uses: actions/checkout@v7
        with:
          repository: UAMS-Web/uams-2020
          ref: cd737498b249b60b9d456d07ddbe38ad0dff6811
          path: uams-2020

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `--ignore-scripts` skips the `preinstall` script, which rewrites package-lock.json.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # The theme's Sass imports bootstrap from its own node_modules (version 4.5.2, the one
      # its package-lock.json pins).
      - name: Install the theme's Bootstrap
        working-directory: uams-2020
        run: npm install --no-save --ignore-scripts --no-audit --no-fund bootstrap@4.5.2

      # Fails when the compiled CSS differs from tests/build/app.golden.css.
      - run: npm test
        env:
          UAMS_2020_THEME: ${{ github.workspace }}/uams-2020

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and
  # every plain job above.
  ci:
    name: CI
    needs: [checks, style-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done

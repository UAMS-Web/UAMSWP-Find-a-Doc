name: CI chain

# cspell:ignore vitest vite mktemp esac
# vitest and vite are the names of inputs and of the tools they switch on, and mktemp is the command a step runs, so none can be reworded.

# Template: .claude/skills/code-quality/templates/ci-reusable.yml in UAMS-Web/uams-claude-skills,
# published as .github/workflows/ci.yml in UAMS-Web/uams-ci-workflows (UAMS-Web/uams-claude-skills#485).
# A repository calls it from its own ci.yml with `uses:` and pins a tag or a commit, so it takes a change
# when it chooses to. The caller keeps a job named `CI` that `needs:` the call, so the context a ruleset
# requires stays `CI` (UAMS-Web/uams-claude-skills#476):
#
#   jobs:
#     checks:
#       uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@<tag or commit>
#     ci:
#       name: CI
#       needs: [checks]
#       if: always()
#       ...
#
# A job called this way reports its check as `<caller job id> / <called job id>` (UAMS-Web/uams-claude-skills#476).
#
# What the caller must carry itself, because every job checks out the caller's repository:
# `.github/actions/setup/action.yml` (the composite action from setup-action.yml), the synced `.claude/skills/`
# scripts these jobs run, and the Composer scripts `test:pint`, `test:refactor`, `stan`, `test` and `mutate`.
# A job's steps are the ones in ci.yml; this file differs in two ways: the legs are inputs, and the optional jobs
# at the end run a command the caller names.
#
# Operating systems (UAMS-Web/uams-claude-skills#438, #454): every job runs as a matrix over `os`. The
# Windows and macOS legs of a job classified for one runner are off, and of a job classified for all three are
# on, until the caller says otherwise:
#
# - `linux-only: true` turns the Windows and macOS legs off for every job.
# - `all-platform-jobs` is a space-separated list of job ids kept on all three runners whatever else is set:
#   a job classified Linux only gains its Windows and macOS legs, and a job classified for all three keeps them
#   under `linux-only`.
# - `windows-jobs` is a space-separated list of job ids that run on `ubuntu-latest` and `windows-latest` and not on
#   `macos-latest`, whatever `linux-only` says: a job classified for all three loses its macOS leg, and a job classified
#   Linux only gains its Windows leg. A job named in both lists keeps all three. Omitted, it changes nothing.
#
# The `mutate` job is the exception to all three inputs: it runs on `ubuntu-latest` only, because a mutation score
# taken on a Windows leg has counted mutants the tests never detect as killed (UAMS-Web/uams-ci-workflows#13).
#
# Each job carries a `# Legs:` line saying which classification it has and why; scripts/check-templates.mjs
# fails this template when a job is unclassified, when a job's matrix is not the one its classification
# requires, or when the final `result` job does not need every job. The code-quality skill's "Which jobs run
# on which operating system" section holds the evidence. A job with no recorded evidence runs on all three.
#
# The four optional jobs (`encoding-guard`, `vitest`, `vite-build`, `mutation-smoke`) are off unless the caller
# turns them on, and each runs a command the caller supplies. `encoding-guard` and `vite-build` are Linux only,
# `vitest` and `mutation-smoke` run on all three, on the seeded-fault evidence in
# UAMS-Web/uams-claude-skills#478 (see the code-quality skill).
#
# Three more optional jobs serve a WordPress plugin (UAMS-Web/uams-claude-skills#607): `floor-lint` (inputs
# `floor-lint-php` and `floor-lint-command`), `download-archive` (`download-archive-command`) and `phpcs`
# (`phpcs-command`). Each is off until its boolean input is `true` and Linux only. A plugin caller passes
# `linux-only: true`, `mutate: false`, those three jobs on, and `pest-command: composer test:unit` when its unit suite is
# that script. A plugin that does not receive the `pest-testing` skill also passes `mutate: false`, which skips the
# `mutate-ignore` job, and `global-test-symbols: false`. Its WordPress integration matrix (a MySQL service, a WordPress download, single and multisite) stays a
# plain job in the caller beside the call, listed in the `needs:` of its `CI` job; this chain does not run it.
#
# Two more optional jobs serve any repository (UAMS-Web/uams-claude-skills#620), each off until its boolean input is `true` and
# Linux only: `guard` (input `guard-patterns`, extra patterns added to the built-in ones) fails when a tracked file looks like a
# secret or personal data, and `dev-lint` (input `dev-lint-exclude`, paths to skip) runs `php -l` on every PHP file under the
# development PHP.
#
# The `mutate` job is on unless the caller passes `mutate: false`. A repository whose source holds no code a
# mutator changes (an add-on template with a stub) has nothing to mutate, and the job fails a run that created
# no mutants, so it needs a way to opt out. `mutate: false` skips the job on every leg, and skips the `mutate-ignore` job with it (UAMS-Web/uams-claude-skills#612):
# annotations only matter where a mutation run reads them, and the check runs a script of the `pest-testing` skill.
#
# The `mutate-ignore` job scans whichever of `app`, `src` and `tests` exist unless the caller names paths in
# `mutate-ignore-paths` (UAMS-Web/uams-claude-skills#534), for a source tree elsewhere such as a plugin's `includes`.
# A path may be a file, so a theme whose annotated code sits at the root names `functions.php` beside its
# directories; `.` also works, because the walk does not enter a nested `vendor/` or `node_modules/` (#627).
#
# What the `mutate` job mutates depends on the caller's event (UAMS-Web/uams-claude-skills#532). A pull request and
# a push mutate only the PHP files under `mutate-paths` that the commit adds, changes or renames, so a run costs what
# the change costs and not what the code base has grown to. A `schedule` or `workflow_dispatch` run mutates everything
# `composer mutate` covers, under `mutate-full-timeout-minutes` (default 180) in place of the 45 minutes the others get.
# The full pass is what catches drift from a dependency or tooling change, so a caller adds a `schedule:` trigger to its
# own `ci.yml` (the caller template shows one). Any other event, and a pushed commit with no parent, mutates everything.
#
# The `pest` job is on unless the caller passes `pest: false`. A repository whose suite needs what the called
# chain cannot give it (private submodules, a secret, a sharded run with its own reports) keeps its own Pest
# jobs as plain jobs beside the call and lists them in the `needs:` of its `CI` job. `pest: false` skips the job
# on every leg and changes nothing else. A `pest` job that is skipped while the input is true (a cancelled run,
# say) still fails the `result` job. `pest-command` (default `composer test`) names the command it runs; the default
# runs with a JUnit report and the skip-baseline and slowest-class checks, and any other command runs as given with
# those two checks skipped, since it writes no report.
#
# The PHP version (UAMS-Web/uams-ci-workflows#25): the first job, `php-version`, reads the caller's `config.platform.php` from
# `composer.json`, and every PHP job except `floor-lint` installs its major and minor, or `8.4` when the key is absent.
# setup-php keeps only the major and minor of a version and installs the newest patch of that line, so a pin of `8.4.12`
# installs the newest 8.4: each PHP job prints the pinned and the installed version side by side so a difference shows,
# and fails when the installed minor is not the one passed.
# `floor-lint` keeps its own input, `floor-lint-php`, which names the supported floor rather than the development PHP.
# The caller's setup action must accept a `php-version` input, as the template's does; one that does not ignores it
# with a warning and installs its own default, which that check then fails.
#
# The final `result` job `needs:` every job, runs `if: always()`, and fails unless each needed job succeeded.
# A needed job reports `skipped` only when its input switched it off, and that is the one skip it accepts.

on:
  workflow_call:
    inputs:
      linux-only:
        description: Run every job on ubuntu-latest only, except the jobs named in all-platform-jobs.
        type: boolean
        default: false
      all-platform-jobs:
        description: Space-separated job ids to run on all three runners whatever linux-only says.
        type: string
        default: ''
      windows-jobs:
        description: Space-separated job ids to run on ubuntu-latest and windows-latest only, with no macos-latest leg, whatever linux-only says. A job also named in all-platform-jobs keeps all three.
        type: string
        default: ''
      share-floor-seconds:
        description: The summed class time, in seconds, below which the pest job's Slowest class step skips its share check (UAMS-Web/uams-claude-skills#505). 0 never skips it.
        type: number
        default: 10
      pest:
        description: Run the pest job. Pass false in a repository that runs its Pest suite as its own jobs.
        type: boolean
        default: true
      mutate:
        description: Run the mutate job. Pass false in a repository whose source holds no code a mutator changes.
        type: boolean
        default: true
      mutate-full-timeout-minutes:
        description: The timeout, in minutes, of the mutate job on a scheduled or manually dispatched run, which mutates everything composer mutate covers (UAMS-Web/uams-claude-skills#532). A pull request or a push mutates only changed files and keeps 45.
        type: number
        default: 180
      mutate-ignore-paths:
        description: Space-separated paths the mutate-ignore job scans for `@pest-mutate-ignore` annotations (UAMS-Web/uams-claude-skills#534). Empty keeps the script's own default, whichever of app, src and tests exist. A WordPress plugin names its source directory, such as includes. A path may be a file, such as a theme's functions.php, and a directory walk skips any nested vendor or node_modules (UAMS-Web/uams-claude-skills#627).
        type: string
        default: ''
      mutate-paths:
        description: Space-separated paths the mutate job selects changed PHP files from, the paths `composer mutate` passes to --path.
        type: string
        default: src
      encoding-guard:
        description: Run the encoding-guard job, which runs encoding-guard-command.
        type: boolean
        default: false
      encoding-guard-command:
        description: The shell command the encoding-guard job runs after a locked Composer install.
        type: string
        default: ''
      vitest:
        description: Run the vitest job, which runs vitest-command after npm ci.
        type: boolean
        default: false
      vitest-command:
        description: The command the vitest job runs.
        type: string
        default: npm run test:js
      vite-build:
        description: Run the vite-build job, which runs vite-build-command after a locked Composer install and npm ci.
        type: boolean
        default: false
      vite-build-command:
        description: The command the vite-build job runs.
        type: string
        default: npm run build
      mutation-smoke:
        description: Run the mutation-smoke job, which runs mutation-smoke-command with PCOV loaded.
        type: boolean
        default: false
      mutation-smoke-command:
        description: The shell command the mutation-smoke job runs after a locked Composer install.
        type: string
        default: ''
      npm-version:
        description: An npm version range to install globally before npm ci in the Node jobs; empty keeps the one Node ships.
        type: string
        default: ''
      pest-command:
        description: The command the pest job runs (UAMS-Web/uams-claude-skills#607). The default, composer test, runs with a JUnit report and the skip-baseline and slowest-class checks that read it; any other command runs as given and those two checks are skipped, because no report is written.
        type: string
        default: composer test
      global-test-symbols:
        description: Run the Global test symbols step of the pest job (UAMS-Web/uams-claude-skills#612). It runs check-global-test-symbols.php from the pest-testing skill, which guards `pest --parallel`. Pass false in a repository that does not receive that skill.
        type: boolean
        default: true
      floor-lint:
        description: Run the floor-lint job, which parses the shipped PHP files under the repository's supported floor.
        type: boolean
        default: false
      floor-lint-php:
        description: The PHP version the floor-lint job installs, the repository's supported floor.
        type: string
        default: '8.2'
      floor-lint-command:
        description: The command the floor-lint job runs.
        type: string
        default: php scripts/lint-floor.php
      download-archive:
        description: Run the download-archive job, which checks that the repository's GitHub download holds only what the plugin runs.
        type: boolean
        default: false
      download-archive-command:
        description: The command the download-archive job runs.
        type: string
        default: node scripts/check-download-archive.mjs
      phpcs:
        description: Run the phpcs job, which runs phpcs-command after a locked Composer install.
        type: boolean
        default: false
      phpcs-command:
        description: The command the phpcs job runs, the WordPress security sniffs.
        type: string
        default: composer test:phpcs
      guard:
        description: Run the guard job, which fails when a tracked file looks like a secret or personal data (UAMS-Web/uams-claude-skills#620).
        type: boolean
        default: false
      guard-patterns:
        description: Extra patterns for the guard job, extended regular expressions separated by spaces or newlines, matched against each tracked path. They add to the built-in ones (wp-config.php, .sql, .csv, .tsv, .xlsx, .env, .pem, .key) and never replace them.
        type: string
        default: ''
      dev-lint:
        description: Run the dev-lint job, which runs php -l on every PHP file under the development PHP (UAMS-Web/uams-claude-skills#620).
        type: boolean
        default: false
      dev-lint-exclude:
        description: Paths the dev-lint job skips, space-separated and relative to the repository root, with no spaces inside a path. vendor and node_modules are always skipped.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  php-version:
    name: Development PHP (config.platform.php) (${{ matrix.os }})
    # Legs: Linux only. It reads composer.json with Node, and the file reads the same on any platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' php-version ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' php-version ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      minor: ${{ steps.read.outputs.minor }}
      pinned: ${{ steps.read.outputs.pinned }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Every PHP job except floor-lint installs the minor of the caller's config.platform.php, or 8.4 when it names
      # none. setup-php keeps only the major and minor of a version and installs the newest patch of that line, so a
      # patch cannot be passed through (UAMS-Web/uams-ci-workflows#25). A pin that is not a string of the form
      # major.minor or major.minor.patch is a configuration error and fails, never a silent 8.4. A missing or unreadable
      # composer.json fails Node, and so this step.
      - name: Read config.platform.php
        id: read
        run: |
          pinned=$(node -e 'const c = JSON.parse(require("fs").readFileSync("composer.json", "utf8")); const p = c.config?.platform?.php; if (p !== undefined && p !== null && typeof p !== "string") { console.error("config.platform.php is a " + typeof p + ", not a string"); process.exit(1) } process.stdout.write(p ?? "")')
          if [ -z "$pinned" ]; then
            echo "minor=8.4" >> "$GITHUB_OUTPUT"
            echo "composer.json names no config.platform.php: the PHP jobs install the newest 8.4."
            exit 0
          fi
          pattern='^([0-9]+\.[0-9]+)(\.[0-9]+)?$'
          if [[ ! "$pinned" =~ $pattern ]]; then
            echo "::error::config.platform.php is '$pinned', which is not a major.minor or major.minor.patch version to install."
            exit 1
          fi
          minor=${BASH_REMATCH[1]}
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "composer.json pins PHP $pinned: the PHP jobs install the newest $minor."

  composer-validate:
    name: Composer validate (composer.lock freshness) (${{ matrix.os }})
    needs: [php-version]
    # Legs: Linux only. It compares composer.json and composer.lock, which read the same on any platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' composer-validate ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' composer-validate ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.php-version.outputs.minor }}
          coverage: none
          tools: composer:v2

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  synced-files:
    name: Synced files (no hand-edited rules or skills) (${{ matrix.os }})
    # Legs: Linux only. It hashes tracked files against the sync manifest; the repository pins line endings, so the bytes match on every platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' synced-files ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' synced-files ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

      # Fails, naming the file, when a copy of a shared workflow differs from its template. A repository with no copy passes.
      - run: node .claude/skills/synced-files/scripts/check-workflow-copies.mjs

  no-emoji:
    name: No emoji in durable records (${{ matrix.os }})
    # Legs: Linux only. It sweeps tracked prose for banned code points with Node alone; no platform branch in the script.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' no-emoji ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' no-emoji ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, line and code point, when prose carries a banned glyph.
      - run: node .claude/skills/writing-comments/scripts/check-no-emoji.mjs

  aggregate-needs:
    name: Aggregate needs (${{ matrix.os }})
    # Legs: Linux only. It parses the workflow files and the allow-list with Node alone; no platform branch in the script.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' aggregate-needs ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' aggregate-needs ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job is missing from the `needs:` list of `CI` or a
      # fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  pint:
    name: Pint (${{ matrix.os }})
    needs: [php-version, composer-validate, synced-files]
    # Legs: Linux only. Pint formats PHP source and reads the same rules on any platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' pint ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' pint ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ needs.php-version.outputs.minor }}

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      - run: composer test:pint

  rector:
    name: Rector (${{ matrix.os }})
    needs: [php-version, pint]
    # Legs: Linux only. Rector reads PHP source and its own config; the result does not depend on the platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' rector ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' rector ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ needs.php-version.outputs.minor }}

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      - run: composer test:refactor

  phpstan:
    name: PHPStan (${{ matrix.os }})
    needs: [php-version, pint]
    # Legs: Linux only. PHPStan analyses PHP source; the result does not depend on the platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' phpstan ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' phpstan ') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ needs.php-version.outputs.minor }}

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      - run: composer stan

  mutate-ignore:
    name: Mutation annotations (none inert) (${{ matrix.os }})
    if: inputs.mutate
    needs: [php-version, pint]
    # Legs: all three. The check has a branch for a CRLF runtime, and a Windows checkout can be CRLF.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' mutate-ignore ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' mutate-ignore ') && '["ubuntu-latest","windows-latest"]' || inputs.linux-only && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ needs.php-version.outputs.minor }}

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      # Fails, naming the file and line, on a bare marker, a tail that names no mutator,
      # prose after a mutator list, and (on a CRLF runtime) a trailing marker. Prints the
      # plugin revision its parsing model was measured against.
      # The paths are left unquoted on purpose, so the shell splits them into one argument each; an empty
      # input passes none, and the script then reads whichever of app, src and tests exist.
      - name: Check the annotations
        shell: bash
        env:
          MUTATE_IGNORE_PATHS: ${{ inputs.mutate-ignore-paths }}
        run: php .claude/skills/pest-testing/scripts/check-mutate-ignore.php $MUTATE_IGNORE_PATHS

  mutate:
    name: Mutation score (changed files, with PCOV) (${{ matrix.os }})
    if: inputs.mutate
    needs: [php-version, rector, phpstan]
    # Legs: Ubuntu only, whatever the caller passes. A Windows leg scored mutants the tests never detect as killed (UAMS-Web/uams-ci-workflows#13), so `all-platform-jobs`, `windows-jobs` and `linux-only` do not reach this matrix.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    # 45 minutes for the changed files a pull request or a push selects; a scheduled or manually dispatched run
    # mutates everything and takes the longer `mutate-full-timeout-minutes`. The event is the caller's.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.mutate-full-timeout-minutes || 45 }}
    # An explicit `bash` runs each step with `-eo pipefail`; the default, `bash -e`, does not,
    # and the run step's `| tee` would then report tee's status in place of Pest's.
    defaults:
      run:
        shell: bash
    steps:
      # Depth 2: on a pull request the checkout is GitHub's merge commit, and its first parent
      # is the base branch it was merged onto. On a push it is the pushed commit and its parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          php-version: ${{ needs.php-version.outputs.minor }}
          coverage: pcov

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      # On a pull request or a push, mutate only the PHP files under mutate-paths that it adds,
      # changes or renames, read from HEAD against its first parent: the merge commit on a pull
      # request, so a later change on the base branch is not counted, and the pushed commit on a
      # push (a squash-merged pull request is one commit). A run that changes none passes with the
      # reason printed. A scheduled or manually dispatched run, and a push of a commit with no
      # parent, mutates everything `composer mutate` covers (UAMS-Web/uams-claude-skills#532).
      - name: Select the files to mutate
        id: select
        env:
          EVENT: ${{ github.event_name }}
          MUTATE_PATHS: ${{ inputs.mutate-paths }}
        run: |
          case "$EVENT" in
            pull_request)
              what="pull request"
              if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
                echo "::error::HEAD is not a merge commit, so the pull request's changes cannot be read."
                exit 1
              fi
              ;;
            push)
              what="push"
              if ! git rev-parse --verify --quiet HEAD^1 > /dev/null; then
                echo "mode=full" >> "$GITHUB_OUTPUT"
                echo "The pushed commit has no parent, so its changes cannot be read: mutating everything composer mutate covers."
                exit 0
              fi
              ;;
            *)
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "Not a pull request or a push ($EVENT): mutating everything composer mutate covers."
              exit 0
              ;;
          esac
          # NUL-separated, so a name git would quote (non-ASCII, a tab) is read as it is
          list=$(mktemp)
          git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- $MUTATE_PATHS > "$list"
          files=()
          while IFS= read -r -d '' f; do
            [[ "$f" == *.php ]] || continue
            if [[ "$f" == *,* || "$f" == *$'\n'* ]]; then
              echo "::error::A changed path holds a comma or a newline, which --path cannot carry: $f"
              exit 1
            fi
            files+=("$f")
          done < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No PHP file under $MUTATE_PATHS is added or changed by this $what, so there is nothing to mutate."
            exit 0
          fi
          echo "Mutating ${#files[@]} changed file(s):"
          printf '%s\n' "${files[@]}"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "paths=$(IFS=,; echo "${files[*]}")" >> "$GITHUB_OUTPUT"

      # `--min=100` makes Pest fail the step on any survivor. The run is kept in a log
      # because a run that mutated nothing is a setup failure that Pest's exit status
      # reports or not depending on its version and `ignore_min_score_on_zero_mutations`.
      # Bash runs this step with pipefail, so `tee` does not hide Pest's status. A later
      # `--path` replaces the one `composer mutate` passes. On changed files, zero mutants is
      # left to the check step, so Pest is told not to fail it.
      - name: Run mutation testing
        if: steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
          PATHS: ${{ steps.select.outputs.paths }}
        run: |
          if [ "$MODE" = "changed" ]; then
            composer mutate -- --min=100 --ignore-min-score-on-zero-mutations --path="$PATHS" 2>&1 | tee mutate.log
          else
            composer mutate -- --min=100 2>&1 | tee mutate.log
          fi

      # Reads the log, not the exit status: fails on zero mutants, and on any untested,
      # uncovered, pending or timed-out mutant. Runs even when the step above failed, so the
      # log's own account of the failure is printed; skipped only when nothing was selected.
      # One exception: changed files that exist, mutated with PCOV loaded, that produce zero
      # mutants hold no code a mutator changes (an interface, say), which is a pass. Zero
      # mutants on a full run, or with no PCOV, still fails.
      - name: Check the mutation run
        if: always() && steps.select.outputs.mode != 'none'
        env:
          MODE: ${{ steps.select.outputs.mode }}
        run: |
          if [ "$MODE" = "changed" ] && sed "s/$(printf '\033')\[[0-9;]*m//g" mutate.log | grep -Eq '(^|[^0-9])0 Mutations for 0 Files created' \
            && php -r 'exit(extension_loaded("pcov") && ini_get("pcov.enabled") ? 0 : 1);'; then
            echo "The changed files produced no mutants: they hold no code a mutator changes, so there is nothing to test."
            exit 0
          fi
          php .claude/skills/pest-testing/scripts/check-mutation-run.php mutate.log

  pest:
    name: Pest (${{ matrix.os }})
    if: inputs.pest
    needs: [php-version, rector, phpstan]
    # Legs: all three. The suite is what runs on the platforms the code ships to: paths, command-line length, BSD tools, case-insensitive file systems.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(contains(format(' {0} ', inputs.all-platform-jobs), ' pest ') && '["ubuntu-latest","windows-latest","macos-latest"]' || contains(format(' {0} ', inputs.windows-jobs), ' pest ') && '["ubuntu-latest","windows-latest"]' || inputs.linux-only && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

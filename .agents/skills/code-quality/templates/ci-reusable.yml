        with:
          php-version: ${{ needs.php-version.outputs.minor }}

      # setup-php installs the newest patch of the minor it is given, so the pin and the runner can differ by a patch
      # (UAMS-Web/uams-ci-workflows#25). This puts both in the log, and fails when the installed minor is not the one
      # passed: a setup action with no php-version input ignores it with only a warning and installs its own default.
      - name: Pinned and installed PHP
        shell: bash
        env:
          PINNED: ${{ needs.php-version.outputs.pinned }}
          MINOR: ${{ needs.php-version.outputs.minor }}
        run: |
          installed=$(php -r 'echo PHP_VERSION;')
          echo "config.platform.php pins ${PINNED:-nothing}; installed PHP $installed"
          case "$installed" in
            "$MINOR".*) ;;
            *) echo "::error::installed PHP $installed is not the $MINOR the php-version job read; does .github/actions/setup take a php-version input?"; exit 1 ;;
          esac

      # Optional: a repository that does not run `pest --parallel`, or does not receive the pest-testing
      # skill, passes `global-test-symbols: false`.
      - name: Global test symbols
        if: inputs.global-test-symbols
        run: php .claude/skills/pest-testing/scripts/check-global-test-symbols.php tests

      # `composer test` passes the extra argument to Pest, which writes the JUnit report the two
      # checks below read. The checks run after the tests whether or not they passed, but not on
      # a cancelled run, so a test failure is reported by the tests and a missing or empty
      # report is reported by the checks.
      - name: Pest
        if: inputs.pest-command == 'composer test'
        run: composer test -- --log-junit=junit.xml

      # A `pest-command` other than the default runs as given. It writes no report, so the two checks
      # below are skipped with it (UAMS-Web/uams-claude-skills#607). An empty command is a configuration
      # error and fails, never a silent pass.
      - name: Pest (custom command)
        if: inputs.pest-command != 'composer test'
        shell: bash
        env:
          COMMAND: ${{ inputs.pest-command }}
        run: |
          if [ -z "$COMMAND" ]; then echo "::error::pest-command is empty"; exit 1; fi
          bash -c "$COMMAND"

      # Fails when more tests were skipped than tests/skip-baseline.json records.
      - name: Skip baseline
        if: ${{ !cancelled() && inputs.pest-command == 'composer test' }}
        run: php .claude/skills/pest-testing/scripts/check-skip-baseline.php --report=junit.xml --baseline=tests/skip-baseline.json

      # Fails when one class takes over 25 percent of the summed class time, or over 900 seconds.
      # The share check is skipped, and the step says so, when the summed class time is under the
      # share-floor-seconds input; the 900-second backstop is checked either way.
      - name: Slowest class
        if: ${{ !cancelled() && inputs.pest-command == 'composer test' }}
        run: php .claude/skills/pest-testing/scripts/check-slowest-class.php --report=junit.xml --share-ceiling=25 --ceiling=900 --share-floor=${{ inputs.share-floor-seconds }}

